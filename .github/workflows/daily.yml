name: Daily Market Scout

on:
  schedule:
    # GitHub Actions schedule is UTC. Two times are used to handle DST shifts for Europe/Riga.
    - cron: "45 12 * * 1-5"
    - cron: "45 13 * * 1-5"
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scout at 15:45 Europe/Riga only
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: arturs.klenders@gmail.com
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: arturs.klenders@gmail.com
          TIMEZONE: Europe/Riga
          OPENAI_TIMEOUT_SECONDS: "60"
          OPENAI_MAX_RETRIES: "3"
          NEWS_LOOKBACK_HOURS: "24"
          NEWS_MAX_ITEMS: "30"
          RSS_TIMEOUT_SECONDS: "15"
          EMAIL_MAX_CHARS: "25000"
        run: |
          now_riga="$(TZ='Europe/Riga' date +'%H:%M')"
          echo "Current Europe/Riga time: ${now_riga}"
          if [ "$now_riga" != "15:45" ]; then
            echo "Not 15:45 in Europe/Riga, skipping run."
            exit 0
          fi
          python scout.py
