name: Daily Market Scout

on:
  schedule:
    # GitHub Actions schedule is UTC. Two times are used to handle DST shifts for Europe/Riga.
    - cron: "45 12 * * 1-5"
    - cron: "45 13 * * 1-5"
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scout at 15:45 Europe/Riga only
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: arturs.klenders@gmail.com
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: arturs.klenders@gmail.com
          TIMEZONE: Europe/Riga
          OPENAI_TIMEOUT_SECONDS: "60"
          OPENAI_MAX_RETRIES: "3"
          NEWS_LOOKBACK_HOURS: "24"
          NEWS_MAX_ITEMS: "30"
          RSS_TIMEOUT_SECONDS: "15"
          EMAIL_MAX_CHARS: "25000"
        run: |
          offset_riga="$(TZ='Europe/Riga' date +'%z')"
          now_riga="$(TZ='Europe/Riga' date +'%Y-%m-%d %H:%M')"
          echo "Current Europe/Riga time: ${now_riga} (offset ${offset_riga})"
          echo "Trigger event: ${EVENT_NAME}, schedule: ${EVENT_SCHEDULE:-n/a}"

          if [ "${EVENT_NAME}" = "schedule" ]; then
            if [ "${offset_riga}" = "+0200" ]; then
              expected_schedule="45 13 * * 1-5"
            elif [ "${offset_riga}" = "+0300" ]; then
              expected_schedule="45 12 * * 1-5"
            else
              echo "Unexpected Europe/Riga offset: ${offset_riga}"
              exit 1
            fi

            if [ "${EVENT_SCHEDULE}" != "${expected_schedule}" ]; then
              echo "Skip: this cron is not the active one for current Riga offset."
              exit 0
            fi
          fi

          python scout.py
